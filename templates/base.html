<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Predictive Thermal Memory{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>

  /* =========================================================
     AURORA THERMAL LAB COLOR PALETTE
     ========================================================= */

  :root {
    --ink: #080B14;
    --panel: #111827;
    --panel-line: #243044;

    --paper: #E8F0FF;
    --ash: #8290A8;

    /* Thermal colors */
    --ember: #FF6B5E;
    --ember-soft: rgba(255, 107, 94, 0.10);

    --teal: #35E0D0;
    --teal-soft: rgba(53, 224, 208, 0.10);

    /* AI / prediction accent */
    --violet: #9B7CFF;
    --violet-soft: rgba(155, 124, 255, 0.10);

    /* Temperature warning */
    --amber: #FFC857;
    --amber-soft: rgba(255, 200, 87, 0.10);

    /* Additional atmospheric color */
    --blue-glow: #4DA6FF;
  }


  * {
    box-sizing: border-box;
  }


  /* =========================================================
     PAGE
     ========================================================= */

  body {
    margin: 0;

    background:
      radial-gradient(
        circle at 12% 8%,
        rgba(53, 224, 208, 0.055),
        transparent 28%
      ),
      radial-gradient(
        circle at 88% 12%,
        rgba(155, 124, 255, 0.055),
        transparent 30%
      ),
      var(--ink);

    color: var(--paper);

    font-family: 'IBM Plex Sans', sans-serif;

    padding: 24px clamp(20px, 5vw, 56px) 48px;
  }


  .mono {
    font-family: 'IBM Plex Mono', monospace;
  }


  a {
    color: inherit;
  }


  /* =========================================================
     TOP BAR
     ========================================================= */

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;

    margin-bottom: 24px;
    padding-bottom: 18px;

    border-bottom: 1px solid var(--panel-line);
  }


  .brand {
    font-size: 15px;
    font-weight: 600;

    letter-spacing: -0.01em;

    display: flex;
    align-items: center;
    gap: 8px;
  }


  .brand-mark {
    width: 9px;
    height: 9px;

    border-radius: 2px;

    background: var(--teal);

    display: inline-block;

    box-shadow:
      0 0 8px rgba(53, 224, 208, 0.65),
      0 0 16px rgba(53, 224, 208, 0.18);
  }


  nav {
    display: flex;
    gap: 4px;
  }


  nav a {
    text-decoration: none;

    font-size: 13px;

    color: var(--ash);

    padding: 7px 14px;

    border-radius: 8px;

    transition:
      color 0.15s ease,
      background 0.15s ease,
      border-color 0.15s ease;
  }


  nav a:hover {
    color: var(--paper);

    background:
      rgba(53, 224, 208, 0.06);

    border: 1px solid
      rgba(53, 224, 208, 0.12);
  }


  nav a.active {
    color: var(--paper);

    background:
      rgba(155, 124, 255, 0.08);

    border: 1px solid
      rgba(155, 124, 255, 0.20);

    box-shadow:
      0 0 18px rgba(155, 124, 255, 0.04);
  }


  /* =========================================================
     PAGE HEADER
     ========================================================= */

  header.page-header {
    margin-bottom: 24px;
  }


  header.page-header h1 {
    font-size: 22px;
    font-weight: 600;

    margin: 0 0 6px;

    letter-spacing: -0.01em;
  }


  header.page-header .subtitle {
    color: var(--ash);

    font-size: 14px;

    margin: 0;

    max-width: 60ch;
  }


  /* =========================================================
     LIVE STATUS
     ========================================================= */

  .live-pill {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 12px;

    color: var(--ash);

    padding: 6px 12px;

    border: 1px solid var(--panel-line);

    border-radius: 999px;

    white-space: nowrap;

    background:
      rgba(53, 224, 208, 0.025);
  }


  .live-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--teal);

    box-shadow:
      0 0 0 0 rgba(53, 224, 208, 0.6),
      0 0 8px rgba(53, 224, 208, 0.7);

    animation: pulse 2.4s ease-out infinite;
  }


  @keyframes pulse {

    0% {
      box-shadow:
        0 0 0 0 rgba(53, 224, 208, 0.55),
        0 0 8px rgba(53, 224, 208, 0.7);
    }

    70% {
      box-shadow:
        0 0 0 8px rgba(53, 224, 208, 0),
        0 0 12px rgba(53, 224, 208, 0.35);
    }

    100% {
      box-shadow:
        0 0 0 0 rgba(53, 224, 208, 0),
        0 0 8px rgba(53, 224, 208, 0.7);
    }
  }


  /* =========================================================
     PANELS
     ========================================================= */

  .panel {
    border: 1px solid var(--panel-line);

    border-radius: 14px;

    padding: 22px clamp(16px, 3vw, 26px);

    background:
      linear-gradient(
        145deg,
        rgba(17, 24, 39, 0.97),
        rgba(13, 18, 32, 0.97)
      );

    box-shadow:
      0 10px 35px rgba(0, 0, 0, 0.22),
      inset 0 1px 0
        rgba(255, 255, 255, 0.025);

    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease;
  }


  .panel:hover {
    border-color:
      rgba(53, 224, 208, 0.16);

    box-shadow:
      0 14px 40px rgba(0, 0, 0, 0.25),
      0 0 24px rgba(53, 224, 208, 0.025),
      inset 0 1px 0
        rgba(255, 255, 255, 0.025);
  }


  .panel h2 {
    font-size: 14px;
    font-weight: 600;

    margin: 0 0 4px;
  }


  .panel .panel-sub {
    font-size: 12px;

    color: var(--ash);

    margin: 0 0 16px;
  }


  /* =========================================================
     FOOTER
     ========================================================= */

  footer.page-footer {
    margin-top: 28px;

    font-size: 12px;

    color: var(--ash);

    display: flex;

    justify-content: space-between;

    flex-wrap: wrap;

    gap: 8px;

    padding-top: 14px;

    border-top: 1px solid var(--panel-line);
  }


  {% block extra_style %}{% endblock %}

</style>
</head>

<body>

  <div class="topbar">

    <div class="brand">
      <span class="brand-mark"></span>
      Predictive Thermal Memory
    </div>

    <nav>

      <a href="/" class="{{ 'active' if active_page == 'dashboard' else '' }}">
        Dashboard
      </a>

      <a href="/history" class="{{ 'active' if active_page == 'history' else '' }}">
        History
      </a>

      <a href="/controls" class="{{ 'active' if active_page == 'controls' else '' }}">
        Controls
      </a>

      <a href="/how-it-works" class="{{ 'active' if active_page == 'how-it-works' else '' }}">
        How it works
      </a>

    </nav>

  </div>


  {% block content %}{% endblock %}


  <footer class="page-footer">

    <span class="mono" id="modelInfo">
      {% block footer_left %}&nbsp;{% endblock %}
    </span>

    <span class="mono" id="dataInfo">
      {% block footer_right %}&nbsp;{% endblock %}
    </span>

  </footer>


  {% block scripts %}{% endblock %}

</body>
</html>
